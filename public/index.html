<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Private Chat Room</title>
 
 <link rel="stylesheet"  href="style.css" >
</head>
<body>
  <div id="login">
    <h2>🔒 Join Private Chat</h2>
    <input type="text" id="username" placeholder="Enter your name" required /><br><br>
    <input type="text" id="room" placeholder="Enter room code" required /><br><br>
    <button onclick="joinChat()">Join Chat</button>
  </div>

  <div id="chat-container">
    <h2>🔐 Private Chat Room</h2>
    <ul id="messages"></ul>
    <form id="form" action="">
      <input id="input" autocomplete="off" placeholder="Type your message..." />
      <button>Send</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let username = '';
    let room = '';

    function joinChat() {
      username = document.getElementById('username').value.trim();
      room = document.getElementById('room').value.trim();

      if (!username || !room) {
        alert('Please enter both username and room code.');
        return;
      }

      document.getElementById('login').style.display = 'none';
      document.getElementById('chat-container').style.display = 'block';

      socket.emit('join room', { username, room });
    }

    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (input.value) {
        socket.emit('chat message', input.value);
        input.value = '';
      }
    });

    socket.on('chat message', (data) => {
      const item = document.createElement('li');
      if (data.user === 'System') {
        item.textContent = data.text;
        item.className = 'system';
      } else {
        item.innerHTML = `<span class="user">${data.user}:</span> ${data.text}`;
      }
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    });
  </script>
</body>
</html>
